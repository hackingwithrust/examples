[package]
name = "llm-apps"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# The runtime the whole track runs on. `default-features = false` keeps the
# CPU path only - no Metal, no CUDA - which is everything this track needs
# and the shortest dependency tree candle has.
candle-core = { version = "0.11.0", default-features = false }
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = "0.3.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
tokenizers = "0.23.2"
