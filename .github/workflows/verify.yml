# The reader clones this repository and runs what is here. That only holds if
# what is here builds — per track, and at every chapter tag a reader might
# check out. This workflow makes both machine-enforced.
#
# Two jobs:
#
#   tracks — on every push to main, build and test each track at its tip.
#   tag    — on every `*-ch*` tag push, build and test the project exactly as
#            it stands at that tag, which is the state a reader following the
#            corresponding article lands on.
#
# A tag prefix maps to a track directory in the `tag` job's case block. The
# block lists every track that is live; a prefix with no entry falls back to
# the single directory whose name starts with it, so a brand-new track's first
# tag still resolves (`interp-ch01` -> interpreter/, `llm-ch02` -> llm-apps/).
#
# Two tracks need Linux system libraries their dependency graphs link against:
# the tauri track (GTK/webkit) and gitdesk (the X11/xkbcommon headers egui's
# windowing layer compiles against). Nothing else here does.

name: Verify

on:
  push:
    branches: [main]
    tags: ['*-ch*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  tracks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: cli-tool
          - track: toy-database
          - track: react-wasm
          - track: tauri-desktop-app/src-tauri
            gtk: true
    name: ${{ matrix.track }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Install the system libraries the Tauri graph links against
        if: matrix.gtk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustc 1.99.0 --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ matrix.track }}

      - name: Build
        run: cargo build --locked --quiet
        working-directory: ${{ matrix.track }}

      - name: Test
        run: cargo test --locked --quiet
        working-directory: ${{ matrix.track }}

  # shortlink gets its own job because its tests need it: #[sqlx::test]
  # creates a per-test database on the Postgres server DATABASE_URL points
  # at, so the job runs a Postgres service next to the build. SQLX_OFFLINE
  # covers the compile-time query! macros via the committed .sqlx cache.
  shortlink:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Compile-time macros must not consult the live server — it has no
      # tables until a #[sqlx::test] applies the migrations to its own
      # per-test database. The committed .sqlx cache serves them instead.
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustc 1.99.0 --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-axum-sqlx-api

      - name: Build
        run: cargo build --locked --quiet
        working-directory: axum-sqlx-api

      - name: Test
        run: cargo test --locked --quiet
        working-directory: axum-sqlx-api

  tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Map the tag to its track
        run: |
          case "$GITHUB_REF_NAME" in
            cli-*)    dir=cli-tool ;;
            api-*)    dir=axum-sqlx-api ;;
            lsm-*)    dir=toy-database ;;
            wasm-*)   dir=react-wasm ;;
            mini-*)   dir=mini-redis ;;
            search-*) dir=search-engine ;;
            tui-*)    dir=tui-ratatui ;;
            stm32-*)  dir=embedded-stm32 ;;
            tauri-*)  dir=tauri-desktop-app/src-tauri ;;
            # The tag prefix and the directory deliberately differ: tags are
            # named after the product (gitdesk), directories after the kind of
            # thing they hold. Without this line the fallback below looks for a
            # directory starting with "gitdesk", finds none, and fails the tag.
            gitdesk-*) dir=git-client ;;
            *)
              # No explicit entry: take the one directory whose name starts with
              # the tag's prefix. Ambiguous or missing -> fail loudly, because a
              # silent skip would mean a tag nobody ever built.
              prefix="${GITHUB_REF_NAME%%-ch*}"
              matches=()
              while IFS= read -r d; do matches+=("$d"); done < <(
                find . -maxdepth 1 -type d -name "${prefix}*" ! -name . -printf '%P\n'
              )
              if [ "${#matches[@]}" -ne 1 ]; then
                echo "::error::tag $GITHUB_REF_NAME matches ${#matches[@]} track directories — add an explicit line to .github/workflows/verify.yml"
                exit 1
              fi
              dir="${matches[0]}"
              ;;
          esac
          echo "DIR=$dir" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Install the system libraries the Tauri graph links against
        if: startsWith(env.DIR, 'tauri-desktop-app')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # eframe's own README lists the xcb/xkbcommon headers, and rfd's GTK
      # file picker (the "open a repository" dialog) needs GTK. A reader on
      # Linux who cannot build the app is exactly what this job exists to
      # prevent, so the packages go in before the build rather than being
      # discovered by a bug report.
      - name: Install the system libraries egui links against
        if: startsWith(env.DIR, 'git-client')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libssl-dev

      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustc 1.99.0 --version

      - name: Install the embedded target
        if: startsWith(env.DIR, 'embedded-stm32')
        run: rustup target add thumbv7em-none-eabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-tag

      - name: Build
        env:
          SQLX_OFFLINE: ${{ startsWith(env.DIR, 'axum-sqlx-api') && 'true' || '' }}
        run: cargo build --locked --quiet
        working-directory: ${{ env.DIR }}

      - name: Test
        # Firmware has no host-runnable tests: the crate is a no_std binary for
        # thumbv7em, so a test harness cannot be built for the host. Building it
        # for the board is the check that matters there.
        if: ${{ !startsWith(env.DIR, 'embedded-stm32') }}
        env:
          SQLX_OFFLINE: ${{ startsWith(env.DIR, 'axum-sqlx-api') && 'true' || '' }}
        run: cargo test --locked --quiet
        working-directory: ${{ env.DIR }}
