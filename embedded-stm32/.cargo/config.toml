[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32F401RE"
# defmt's own linker script, generated by the crate's build script and
# found through the link-search path it prints. It collects the interned
# format strings into one `.defmt` section; without it the strings are
# scattered and the decoder on the host cannot find them.
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]

# The log level is a compile-time decision: the defmt macros read this
# variable when the crate is built and compile out everything below it.
# Without it defmt logs at `error` only — see the article.
[env]
DEFMT_LOG = "info"
