[package]
name = "firmware"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/hackingwithrust/examples"

[dependencies]
bmpe280 = "1.0.5"
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1.2.0"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000"] }
embassy-time-driver = "0.2.2"
embassy-time-queue-utils = "0.3.2"
embedded-hal = "1.0.0"
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f401"] }
